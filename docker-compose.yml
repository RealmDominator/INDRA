# =============================================================================
# INDRA — Docker Compose (Development Skeleton)
# =============================================================================
# This file provides infrastructure services only (database, cache).
# Application services (backend, frontend) are NOT yet implemented.
# They will be added when feature code is ready.
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: indra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indra_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-indra_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Load schema on first run
      # - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  # ---------------------------------------------------------------------------
  # Redis — API response cache (optional for Phase 1)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: indra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ---------------------------------------------------------------------------
  # Backend — FastAPI (PLACEHOLDER — not yet implemented)
  # ---------------------------------------------------------------------------
  # backend:
  #   build: ./backend
  #   container_name: indra-backend
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - db
  #     - redis
  #   env_file:
  #     - .env

  # ---------------------------------------------------------------------------
  # Frontend — React (PLACEHOLDER — not yet implemented)
  # ---------------------------------------------------------------------------
  # frontend:
  #   build: ./frontend
  #   container_name: indra-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
