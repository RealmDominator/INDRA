name: INDRA CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: indra_user
          POSTGRES_PASSWORD: indra_password
          POSTGRES_DB: indra_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indra_user -d indra_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          APP_ENV: test
          APP_DEBUG: "false"
          DATABASE_URL: postgresql+asyncpg://indra_user:indra_password@localhost:5432/indra_db
        run: python scripts/db/init_db.py && python -m pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Static configuration checks
        shell: bash
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f docker-compose.production.yml
          ! git ls-files .env | grep -q .
